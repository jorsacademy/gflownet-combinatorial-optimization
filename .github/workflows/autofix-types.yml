name: One-time strict typing fixes

on:
  push:
    branches: [trajectory-balance-mwis-implementation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trajectory-balance-mwis-implementation
          fetch-depth: 0

      - name: Apply narrow typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          evaluation_path = Path("src/gfnco/evaluation.py")
          evaluation = evaluation_path.read_text(encoding="utf-8")
          evaluation = replace_once(
              evaluation,
              "from collections import Counter\n",
              "from collections import Counter\nfrom collections.abc import Callable\n",
              "evaluation Callable import",
          )
          evaluation = replace_once(
              evaluation,
              "    baseline_specs = (\n",
              "    baseline_specs: tuple[tuple[str, Callable[[], tuple[int, ...]]], ...] = (\n",
              "typed baseline samplers",
          )
          evaluation = replace_once(
              evaluation,
              "        oracle_specs = (\n",
              "        oracle_specs: tuple[tuple[str, Callable[[], tuple[int, ...]]], ...] = (\n",
              "typed oracle samplers",
          )
          evaluation_path.write_text(evaluation, encoding="utf-8")

          cli_path = Path("src/gfnco/cli.py")
          cli = cli_path.read_text(encoding="utf-8")
          cli = replace_once(
              cli,
              "from gfnco.evaluation import (\n    build_benchmark_report,\n",
              "from gfnco.evaluation import (\n    SamplingMetrics,\n    build_benchmark_report,\n",
              "SamplingMetrics import",
          )
          cli = replace_once(
              cli,
              "            config = _training_config(args)\n",
              "            training_config = _training_config(args)\n",
              "training config name",
          )
          if cli.count("                    config=config,\n") != 2:
              raise RuntimeError("expected two training config keyword uses")
          cli = cli.replace(
              "                    config=config,\n",
              "                    config=training_config,\n",
          )
          cli = replace_once(
              cli,
              "            rows = []\n",
              "            rows: list[SamplingMetrics] = []\n",
              "benchmark row annotation",
          )
          cli = replace_once(
              cli,
              "            report = build_benchmark_report(\n",
              "            benchmark_report = build_benchmark_report(\n",
              "benchmark report name",
          )
          cli = replace_once(
              cli,
              "                save_report_json(report, args.output_json)\n",
              "                save_report_json(benchmark_report, args.output_json)\n",
              "benchmark JSON report",
          )
          cli = replace_once(
              cli,
              "                save_report_csv(report, args.output_csv)\n",
              "                save_report_csv(benchmark_report, args.output_csv)\n",
              "benchmark CSV report",
          )
          cli = replace_once(
              cli,
              "            _write_or_print(report.to_dict(), None)\n",
              "            _write_or_print(benchmark_report.to_dict(), None)\n",
              "benchmark printed report",
          )
          cli = replace_once(
              cli,
              "        config = ResearchConfig(\n",
              "        research_config = ResearchConfig(\n",
              "research config name",
          )
          cli = replace_once(
              cli,
              "        gflownet, reinforce, report = run_research_experiment(config)\n",
              "        gflownet, reinforce, research_report = run_research_experiment(\n            research_config\n        )\n",
              "research result names",
          )
          if cli.count('"research_config": report.to_dict()["config"],') != 2:
              raise RuntimeError("expected two research metadata config uses")
          cli = cli.replace(
              '"research_config": report.to_dict()["config"],',
              '"research_config": research_report.to_dict()["config"],',
          )
          if cli.count('"training_corpus": report.training_corpus,') != 2:
              raise RuntimeError("expected two research training-corpus uses")
          cli = cli.replace(
              '"training_corpus": report.training_corpus,',
              '"training_corpus": research_report.training_corpus,',
          )
          cli = replace_once(
              cli,
              "        save_research_report(report, args.output_report)\n",
              "        save_research_report(research_report, args.output_report)\n",
              "research report persistence",
          )
          cli_path.write_text(cli, encoding="utf-8")

          Path(".github/workflows/autofix-types.yml").unlink()
          PY

      - name: Format, validate, and commit
        run: |
          python -m pip install "ruff>=0.6,<1"
          ruff format src/gfnco/evaluation.py src/gfnco/cli.py
          ruff check src/gfnco/evaluation.py src/gfnco/cli.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix strict typing boundaries"
          git push origin HEAD:trajectory-balance-mwis-implementation
